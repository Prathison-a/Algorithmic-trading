<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading Forecast Terminal</title>
    <script src="/static/lightweight-charts.js"></script>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        /* RSI / Volume Delta panel layout - kept inline so it works regardless of style.css */
        .charts-wrapper {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 0;
        }

        .chart-container-box {
            flex: 3;
            min-height: 0;
        }

        .rsi-container-box {
            flex: 1;
            min-height: 120px;
            border-top: 1px solid #2b2b36;
        }

        .volume-delta-container-box {
            flex: 1;
            min-height: 120px;
            border-top: 1px solid #2b2b36;
        }

        .macd-container-box,
        .stochastic-container-box,
        .mfi-container-box,
        .adx-container-box,
        .obv-container-box {
            flex: 1;
            min-height: 120px;
            border-top: 1px solid #2b2b36;
        }

        /* ---- Top-right action buttons (small) ---- */
        .control-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
            width: 100%;
        }

        .top-actions {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
            flex-wrap: wrap;
        }

        .btn-sm {
            padding: 4px 10px;
            font-size: 12px;
            line-height: 1.4;
            border-radius: 4px;
            cursor: pointer;
        }

        /* ---- Chart display toggles (Candles / Prediction Line) ---- */
        .display-toggle-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
            width: 100%;
            padding: 6px 0;
        }

        /* ---- Available Indicators panel (plain checkboxes, dark theme) ---- */
        .indicators-panel {
            width: 100%;
            padding: 10px 0 6px 0;
        }

        .indicators-panel-title {
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.03em;
            text-transform: uppercase;
            color: #9a9aa5;
            border-bottom: 1px solid #2b2b36;
            padding-bottom: 6px;
            margin-bottom: 8px;
        }

        .indicator-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 16px;
        }

        .indicator-item {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            min-width: 110px;
        }

        .indicator-item input[type="checkbox"] {
            width: 15px;
            height: 15px;
            margin: 0;
            accent-color: #4f8cff;
            cursor: pointer;
            flex-shrink: 0;
            /* Explicitly a standard checkbox - no custom slider/toggle appearance */
            appearance: auto;
            -webkit-appearance: checkbox;
        }

        .indicator-item input[type="checkbox"]:focus-visible {
            outline: 2px solid #4f8cff;
            outline-offset: 2px;
        }

        .indicator-item label {
            font-size: 12px;
            color: #d7d7de;
            user-select: none;
            cursor: pointer;
        }

        /* Reuse existing toggle-group styles for the two chart-display checkboxes */
        .toggle-group {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .toggle-label {
            font-size: 12px;
            color: #d7d7de;
            user-select: none;
        }

        .toggle-group input[type="checkbox"] {
            width: 15px;
            height: 15px;
            accent-color: #4f8cff;
            cursor: pointer;
            flex-shrink: 0;
        }

        .toggle-group input[type="checkbox"]:focus-visible {
            outline: 2px solid #4f8cff;
            outline-offset: 2px;
        }

        @media (max-width: 600px) {
            .indicator-item {
                min-width: 45%;
            }
        }

        /* ============================================================
           Training Indicators - toggle switch + collapsible panel
           ============================================================ */
        .switch-group {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .switch-group .toggle-label {
            white-space: nowrap;
        }

        /* Real sliding toggle switch (distinct from the plain indicator checkboxes) */
        .switch {
            position: relative;
            display: inline-block;
            width: 36px;
            height: 20px;
            flex-shrink: 0;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .switch .slider-toggle {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #3a3a46;
            border-radius: 20px;
            transition: background-color 0.25s ease;
        }

        .switch .slider-toggle::before {
            position: absolute;
            content: "";
            height: 14px;
            width: 14px;
            left: 3px;
            bottom: 3px;
            background-color: #d7d7de;
            border-radius: 50%;
            transition: transform 0.25s ease;
        }

        .switch input:checked+.slider-toggle {
            background-color: #4f8cff;
        }

        .switch input:checked+.slider-toggle::before {
            transform: translateX(16px);
        }

        .switch input:focus-visible+.slider-toggle {
            outline: 2px solid #4f8cff;
            outline-offset: 2px;
        }

        /* Collapsible panel - collapsed by default, takes up no space when closed */
        #trainingIndicatorsPanel,
        #indicatorsPanel {
            width: 100%;
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            padding: 0 0;
            margin: 0;
            border-top: 0px solid #2b2b36;
            transition: max-height 0.25s ease, opacity 0.25s ease, padding 0.25s ease, margin 0.25s ease;
        }

        #trainingIndicatorsPanel.open,
        #indicatorsPanel.open {
            max-height: 300px;
            opacity: 1;
            padding: 10px 0 6px 0;
            margin-top: 4px;
            border-top: 1px solid #2b2b36;
        }

        @media (max-width: 600px) {
            .control-header {
                flex-wrap: wrap;
            }

            .top-actions {
                flex-wrap: wrap;
            }
        }

        /* ============================================================
           Second-row navigation: Chart Analysis 1 / 2 / 3 tabs
           Styled to match the existing dark dashboard theme.
           ============================================================ */
        .chart-analysis-nav {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px;
            border: 1px solid #2b2b36;
            border-radius: 8px;
            background-color: rgba(255, 255, 255, 0.02);
            flex-wrap: wrap;
            flex-shrink: 0;
        }

        .chart-analysis-tab {
            appearance: none;
            -webkit-appearance: none;
            background-color: transparent;
            border: 1px solid transparent;
            color: #9a9aa5;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.01em;
            padding: 5px 12px;
            border-radius: 5px;
            cursor: pointer;
            transition: color 0.15s ease, background-color 0.15s ease, border-color 0.15s ease;
            line-height: 1.4;
            white-space: nowrap;
        }

        .chart-analysis-tab:hover {
            color: #d7d7de;
            background-color: rgba(79, 140, 255, 0.08);
            border-color: #3a3a46;
        }

        .chart-analysis-tab:focus-visible {
            outline: 2px solid #4f8cff;
            outline-offset: 2px;
        }

        .chart-analysis-tab.active {
            color: #ffffff;
            background-color: #4f8cff;
            border-color: #4f8cff;
        }

        .chart-analysis-panel {
            display: none;
            flex-direction: column;
            flex: 1;
            min-height: 0;
        }

        .chart-analysis-panel.active {
            display: flex;
        }

        /* Placeholder styling for the new (currently empty) analysis panels */
        .chart-analysis-placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 1;
            min-height: 200px;
            color: #6f6f7a;
            font-size: 13px;
            text-align: center;
            padding: 24px;
        }

        @media (max-width: 600px) {
            .chart-analysis-nav {
                width: 100%;
                justify-content: center;
                order: 10;
            }

            .chart-analysis-tab {
                flex: 1 1 auto;
                text-align: center;
                padding: 6px 6px;
                font-size: 11px;
            }
        }
    </style>
</head>

    <script src="/static/app.js"></script>
    <script>
        // Training Indicators toggle - purely additive, does not touch app.js or existing logic.
        // Panel visibility is controlled with a CSS class so checkbox states inside it
        // are never reset when the panel is hidden/shown.
        (function () {
            var trainingToggle = document.getElementById('chkTrainingIndicatorsToggle');
            var trainingPanel = document.getElementById('trainingIndicatorsPanel');

            if (trainingToggle && trainingPanel) {
                trainingToggle.addEventListener('change', function () {
                    trainingPanel.classList.toggle('open', trainingToggle.checked);
                });
            }

            var indicatorsToggle = document.getElementById('chkIndicatorsToggle');
            var indicatorsPanel = document.getElementById('indicatorsPanel');

            if (indicatorsToggle && indicatorsPanel) {
                indicatorsToggle.addEventListener('change', function () {
                    indicatorsPanel.classList.toggle('open', indicatorsToggle.checked);
                });
            }
        })();

        // Chart Analysis 1 / 2 / 3 second-row tab navigation.
        // Purely additive: switches which panel is visible via CSS classes,
        // does not touch app.js, does not reload the page, and does not
        // remove/reset any existing chart/indicator elements (Chart Analysis 1
        // simply wraps the original charts-wrapper markup as-is).
        (function () {
            var tabs = document.querySelectorAll('.chart-analysis-tab');
            var panels = document.querySelectorAll('.chart-analysis-panel');

            tabs.forEach(function (tab) {
                tab.addEventListener('click', function () {
                    var targetId = tab.getAttribute('data-target');

                    tabs.forEach(function (t) {
                        var isActive = t === tab;
                        t.classList.toggle('active', isActive);
                        t.setAttribute('aria-selected', isActive ? 'true' : 'false');
                    });

                    panels.forEach(function (panel) {
                        panel.classList.toggle('active', panel.id === targetId);
                    });

                    // If Lightweight Charts instances exist on window and expose a
                    // resize/fit method, give them a chance to redraw when the
                    // Chart Analysis 1 panel becomes visible again (charts can
                    // render at 0 width if resized while hidden via display:none).
                    if (targetId === 'chartAnalysis1' && typeof window.dispatchEvent === 'function') {
                        window.dispatchEvent(new Event('resize'));
                    }
                });
            });
        })();
    </script>
